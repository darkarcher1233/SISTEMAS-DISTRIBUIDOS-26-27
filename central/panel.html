<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WaterManagement · Central</title>
<!-- Panel de CENTRAL (Vlad). Lo sirve central/panel.py; pide /estado cada 1 s. Sin librerías. -->
<style>
  :root {
    --fondo: #0f1419;
    --tarjeta: #1a2129;
    --texto: #e6edf3;
    --suave: #8b98a5;
    --verde: #2ea043;
    --verde-claro: #56d364;
    --rojo: #e5534b;
    --naranja: #f0883e;
    --gris: #6e7681;
  }
  * { box-sizing: border-box; }
  html { font-size: clamp(16px, 1.15vw, 24px); }  /* crece en pantallas grandes / proyector */
  body {
    margin: 0;
    padding: 1.25rem 1.5rem 2rem;
    background: var(--fondo);
    color: var(--texto);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
  }
  h1 { margin: 0; font-size: 1.8rem; font-weight: 650; }
  h2 { margin: 2rem 0 0.75rem; font-size: 1.2rem; color: var(--suave); font-weight: 600; }
  .conexion { display: flex; align-items: center; gap: 0.6rem; color: var(--suave); font-size: 1rem; }
  .punto { width: 0.8rem; height: 0.8rem; border-radius: 50%; background: var(--gris); }
  .en-linea .punto { background: var(--verde-claro); box-shadow: 0 0 0.5rem var(--verde-claro); }
  .en-linea .texto-conexion { color: var(--texto); }

  /* Rejilla de tarjetas: tantas columnas como quepan */
  .rejilla {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
    gap: 1rem;
  }
  .ws {
    background: var(--tarjeta);
    border: 0.2rem solid var(--gris);
    border-radius: 0.75rem;
    padding: 1rem 1.1rem;
    min-height: 9rem;
  }
  .ws-id { font-size: 2rem; font-weight: 700; line-height: 1.1; }
  .ws-ubicacion { color: var(--suave); margin: 0.2rem 0 0.75rem; }
  .ws-estado {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 0.4rem;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.03em;
    color: #0f1419;
    background: var(--gris);
  }
  .ws-datos { margin: 0.75rem 0 0; display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.75rem; }
  .ws-datos dt { color: var(--suave); }
  .ws-datos dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
  .vacio { color: var(--suave); font-style: italic; }

  /* Colores por estado (nombres EXACTOS de las constantes de WM_Central.py) */
  .DISPONIBLE      { border-color: var(--verde);   background: #12261a; }
  .DISPONIBLE      .ws-estado { background: var(--verde); }
  .REGANDO         { border-color: var(--verde-claro); animation: parpadeo 1s ease-in-out infinite; }
  .REGANDO         .ws-estado { background: var(--verde-claro); }
  .FUGA            { border-color: var(--rojo);    background: #2d1416; }
  .FUGA            .ws-estado { background: var(--rojo); }
  .FUERA_SERVICIO  { border-color: var(--naranja); background: #2b1d10; }
  .FUERA_SERVICIO  .ws-estado { background: var(--naranja); }
  .DESCONECTADA    { border-color: var(--gris);    background: #1a1d21; color: var(--suave); }
  .DESCONECTADA    .ws-id { color: var(--suave); }

  @keyframes parpadeo {
    0%, 100% { background: #12261a; }
    50%      { background: #23552f; }
  }

  /* Últimos eventos */
  .log {
    margin: 0;
    padding: 0.9rem 1rem;
    background: #0a0d11;
    border: 1px solid #2a323c;
    border-radius: 0.6rem;
    font-family: Consolas, "Cascadia Mono", "DejaVu Sans Mono", monospace;
    font-size: 0.95rem;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 3rem;
  }
  .log div:first-child { color: var(--texto); }
  .log div { color: var(--suave); }

  /* Leyenda */
  .leyenda { display: flex; flex-wrap: wrap; gap: 0.6rem 1.5rem; margin-top: 1.5rem; color: var(--suave); }
  .leyenda span { display: inline-flex; align-items: center; gap: 0.5rem; }
  .leyenda i { width: 1rem; height: 1rem; border-radius: 0.2rem; display: inline-block; }
</style>
</head>
<body>
  <header>
    <h1>WaterManagement · Central</h1>
    <div class="conexion" id="conexion">
      <span id="hora">--:--:--</span>
      <span class="punto"></span>
      <span class="texto-conexion" id="texto-conexion">sin conexión</span>
    </div>
  </header>

  <main>
    <section class="rejilla" id="rejilla">
      <p class="vacio">Esperando datos de Central…</p>
    </section>

    <h2>Últimos eventos</h2>
    <div class="log" id="log"><span class="vacio">(sin eventos)</span></div>

    <div class="leyenda">
      <span><i style="background: var(--verde)"></i>Disponible</span>
      <span><i style="background: var(--verde-claro)"></i>Regando (parpadea)</span>
      <span><i style="background: var(--rojo)"></i>Fuga</span>
      <span><i style="background: var(--naranja)"></i>Fuera de servicio</span>
      <span><i style="background: var(--gris)"></i>Desconectada</span>
    </div>
  </main>

<script>
  // Texto de la plaqueta para cada estado; si llega uno desconocido se muestra tal cual
  const TEXTO_ESTADO = {
    DISPONIBLE: "Disponible",
    REGANDO: "Regando",
    FUGA: "Fuga",
    FUERA_SERVICIO: "Fuera de servicio",
    DESCONECTADA: "Desconectada",
  };

  // Crea un elemento con textContent (nunca innerHTML: la ubicación viene de la red)
  function el(tag, clase, texto) {
    const e = document.createElement(tag);
    if (clase) e.className = clase;
    if (texto !== undefined) e.textContent = texto;
    return e;
  }

  // Las tarjetas se reutilizan (ws_id -> <article>): si se crearan de nuevo cada segundo,
  // la animación de REGANDO volvería a empezar y no se vería parpadear bien
  const tarjetas = new Map();

  function rellenar(t, ws) {
    const clase = "ws " + ws.estado;
    if (t.className !== clase) t.className = clase;
    const hijos = [
      el("div", "ws-id", ws.ws_id),
      el("div", "ws-ubicacion", ws.ubicacion || "—"),
      el("span", "ws-estado", TEXTO_ESTADO[ws.estado] || ws.estado),
    ];
    if (ws.estado === "REGANDO") {
      const d = el("dl", "ws-datos");
      d.append(el("dt", "", "Caudal"),   el("dd", "", Number(ws.caudal || 0).toFixed(1) + " L/min"));
      d.append(el("dt", "", "Volumen"),  el("dd", "", Number(ws.volumen || 0).toFixed(2) + " L"));
      d.append(el("dt", "", "Operario"), el("dd", "", ws.operario || "—"));
      hijos.push(d);
    }
    t.replaceChildren(...hijos);
  }

  function pintar(datos) {
    const rejilla = document.getElementById("rejilla");
    const vistas = new Set(datos.estaciones.map(ws => ws.ws_id));
    for (const [id, t] of tarjetas) {
      if (!vistas.has(id)) { t.remove(); tarjetas.delete(id); }
    }
    if (datos.estaciones.length === 0) {
      rejilla.replaceChildren(el("p", "vacio", "Todavía no hay ninguna WS registrada"));
    } else {
      rejilla.querySelectorAll(".vacio").forEach(p => p.remove());
      datos.estaciones.forEach((ws, i) => {
        let t = tarjetas.get(ws.ws_id);
        if (!t) { t = el("article"); tarjetas.set(ws.ws_id, t); }
        rellenar(t, ws);
        // mover solo si no está ya en su sitio (moverla también reinicia la animación)
        if (rejilla.children[i] !== t) rejilla.insertBefore(t, rejilla.children[i] || null);
      });
    }

    const log = document.getElementById("log");
    const lineas = datos.log.slice().reverse();  // las más nuevas arriba
    if (lineas.length === 0) {
      log.replaceChildren(el("span", "vacio", "(sin eventos)"));
    } else {
      log.replaceChildren(...lineas.map(l => el("div", "", l)));
    }

    document.getElementById("hora").textContent = datos.hora;
  }

  function enLinea(si) {
    document.getElementById("conexion").classList.toggle("en-linea", si);
    document.getElementById("texto-conexion").textContent = si ? "en línea" : "sin conexión";
  }

  // Cada 1000 ms: pedir /estado y repintar. La siguiente petición sale cuando acaba esta.
  async function actualizar() {
    try {
      const r = await fetch("/estado", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      pintar(await r.json());
      enLinea(true);
    } catch (e) {
      enLinea(false);
    }
    setTimeout(actualizar, 1000);
  }
  actualizar();
</script>
</body>
</html>
