# CI/CD GitHub -> AWS: en cada push a main (o a mano desde la pestaña Actions) GitHub entra por
# SSH en la EC2 y ejecuta deploy/deploy_ec2.sh (git pull + docker compose up -d --build).
#
# Secretos (GitHub > Settings > Secrets and variables > Actions > New repository secret):
#   EC2_HOST     IP pública actual de la EC2 (en el Learner Lab cambia: actualizarla al arrancar el lab)
#   EC2_USER     usuario SSH: ubuntu (AMI Ubuntu) o ec2-user (Amazon Linux)
#   EC2_SSH_KEY  contenido COMPLETO del fichero .pem (labsuser.pem), incluidas las líneas BEGIN/END
#   EC2_REPO_DIR (opcional) carpeta del repo en la EC2; por defecto ~/SISTEMAS-DISTRIBUIDOS-26-27

name: Desplegar en AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: SSH a la EC2 y deploy_ec2.sh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            cd ${{ secrets.EC2_REPO_DIR || '~/SISTEMAS-DISTRIBUIDOS-26-27' }}   # sin comillas: así ~ se expande
            bash deploy/deploy_ec2.sh
