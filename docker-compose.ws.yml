# docker-compose del LABORATORIO, PC 2: dos Watering Stations (Monitor + Engine de cada una)
# Responsable: Vlad · Semana 4
#
# Uso (desde la raíz del repo, con el .env creado a partir de .env.example):
#   docker compose -f docker-compose.ws.yml up -d --build
#   docker attach ws1_e        (menú del Engine; salir sin matarlo: Ctrl+P y luego Ctrl+Q)
#
# - Todos usan la misma imagen (sd-app) del Dockerfile común; solo cambia "command".
# - ${CENTRAL} y ${KAFKA_BROKER} salen del .env.
# - El Engine encuentra a su Monitor por el NOMBRE del servicio (ws1_m:6000): Docker Compose
#   crea una red propia con DNS interno. Los dos Monitor escuchan en el 6000, pero cada uno
#   en su contenedor, así que no chocan.
# - Si el Engine arranca antes que su Monitor, o el Monitor antes que Central, reintentan solos.
# - Pantallas web: Monitor WS1 http://localhost:8100 · Engine WS1 :8200 · WS2 :8101 y :8201

name: sd-ws   # nombre de proyecto propio: no se mezcla con el Kafka de docker-compose.yml

services:
  ws1_m:
    build: .
    image: sd-app
    container_name: ws1_m
    ports: ["8100:8100"]   # pantalla web
    command: ["python", "-m", "ws.WM_WS_M", "6000", "${CENTRAL}", "WS1", "Parque Norte"]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # para Linux; en Docker Desktop ya existe
    restart: on-failure

  ws1_e:
    image: sd-app
    container_name: ws1_e
    ports: ["8200:8200"]   # pantalla web
    command: ["python", "-m", "ws.WM_WS_E", "${KAFKA_BROKER}", "ws1_m:6000"]
    depends_on:
      - ws1_m
    restart: on-failure
    stdin_open: true   # menú con input()
    tty: true

  ws2_m:
    image: sd-app
    container_name: ws2_m
    ports: ["8101:8100"]   # pantalla web
    command: ["python", "-m", "ws.WM_WS_M", "6000", "${CENTRAL}", "WS2", "Parque Sur"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure

  ws2_e:
    image: sd-app
    container_name: ws2_e
    ports: ["8201:8200"]   # pantalla web
    command: ["python", "-m", "ws.WM_WS_E", "${KAFKA_BROKER}", "ws2_m:6000"]
    depends_on:
      - ws2_m
    restart: on-failure
    stdin_open: true
    tty: true
