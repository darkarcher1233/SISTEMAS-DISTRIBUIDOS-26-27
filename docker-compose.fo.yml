# docker-compose del LABORATORIO, PC 1: dos operarios (WM_FO)
# Responsable: Vlad · Semana 4
#
# Uso (desde la raíz del repo, con el .env creado a partir de .env.example):
#   docker compose -f docker-compose.fo.yml up -d --build
#   docker attach fo1          (menú del operario; salir sin matarlo: Ctrl+P y luego Ctrl+Q)
#
# El FO solo usa Kafka (no sockets): basta con KAFKA_BROKER=<IP_EC2>:9092 en el .env.
# Pantallas web: FO1 http://localhost:8300 · FO2 http://localhost:8301
# Los ficheros de WM_FO/peticiones/ van dentro de la imagen (COPY . .).

name: sd-fo   # nombre de proyecto propio: no se mezcla con el Kafka de docker-compose.yml

services:
  fo1:
    build: .
    image: sd-app
    container_name: fo1
    ports: ["8300:8300"]   # pantalla web
    command: ["python", "-m", "WM_FO.WM_FO", "${KAFKA_BROKER:?Falta KAFKA_BROKER en el .env}", "FO1"]
    restart: on-failure
    stdin_open: true   # menú con input()
    tty: true

  fo2:
    image: sd-app
    container_name: fo2
    ports: ["8301:8300"]   # pantalla web
    command: ["python", "-m", "WM_FO.WM_FO", "${KAFKA_BROKER:?Falta KAFKA_BROKER en el .env}", "FO2"]
    restart: on-failure
    stdin_open: true
    tty: true
